<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5132">
<meta name="description" content="KebunRakyat SPMS — manajemen perkebunan rakyat berbasis GIS, mobile & AI">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KebunRakyat SPMS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--pri:#1f5132;--pri2:#2f7a4b;--acc:#c9a227;--bg:#f5f7f4;--card:#fff;--tx:#1b2620;--mut:#66736b;--bd:#e2e8e3;--bad:#c0392b;--ok:#2e8b57;--warn:#d98e04}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#fab{position:fixed;left:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:20;background:var(--acc);color:#1b1b1b;border:0;border-radius:99px;padding:9px 13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:12px;opacity:.92}
#field{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
header img{width:34px;height:34px;border-radius:9px}header b{flex:1;font-size:15px}.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap}
main{flex:1;overflow:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 12px;text-align:center;font-weight:600;cursor:pointer}.tile span{display:block;font-size:26px;margin-bottom:4px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;min-height:42px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:#fff;font:600 13px inherit;cursor:pointer;min-height:42px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.acc{background:var(--acc);border-color:var(--acc)}.btn.block{width:100%;margin-top:12px}.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.muted{color:var(--mut)}.tiny{font-size:12px}.err{color:var(--bad)}
#fmap{height:52vh;border-radius:12px;border:1px solid var(--bd)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px;margin:8px 0}.stats b{display:block;font-size:16px}.stats span{font-size:11px;color:var(--mut)}
.q{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:#eee}.pill.ok{background:#d8f0e1;color:var(--ok)}.pill.bad{background:#f8dcd8;color:var(--bad)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18241d;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;z-index:99;max-width:90vw}
img.pv{max-width:100%;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<iframe id="appFrame" class="hidden" title="KebunRakyat SPMS" allow="geolocation *; camera *; microphone *; clipboard-write *; fullscreen *; serial *"></iframe>
<button id="fab" class="hidden" onclick="F.open()">⚡ Mode Lapangan</button>
<section id="field" class="hidden">
  <header><img src="icon-192.png" alt=""><b id="fTitle">Mode Lapangan</b><span class="badge" id="fNet"></span></header>
  <main id="fMain"></main>
</section>
<div id="toast" class="hidden"></div>
<script>
/* ============ KONFIGURASI: ganti dengan URL Web App Apps Script Anda (akhiran /exec) ============ */
var CONFIG = { GAS_URL: 'https://script.google.com/macros/s/AKfycbyxL8rEhy_Dd_JltEHEcUAsj_bems-uQ8pMy82Uv0JxRE0b07uKXqLYStae3rJWalnm/exec', APP_NAME: 'KebunRakyat SPMS', VERSION: '1.0.0' };
/* ============================================================================================ */
'use strict';
var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(m, ms) { var t = $('#toast'); t.textContent = m; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.add('hidden'); }, ms || 2800); }
var LS = { get: function (k, d) { try { var v = localStorage.getItem('spmsf_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set: function (k, v) { try { localStorage.setItem('spmsf_' + k, JSON.stringify(v)); } catch (e) { toast('Penyimpanan perangkat penuh!'); } }, del: function (k) { localStorage.removeItem('spmsf_' + k); } };
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function nf(n, d) { return Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: d == null ? 2 : d }); }

/* ---------- IndexedDB: antrean offline (foto aman disimpan di perangkat) ---------- */
var IDB = {
  db: null,
  open: function () { return IDB.db ? Promise.resolve(IDB.db) : new Promise(function (res, rej) { var r = indexedDB.open('spms_field', 1); r.onupgradeneeded = function () { r.result.createObjectStore('queue', { keyPath: 'id' }); }; r.onsuccess = function () { IDB.db = r.result; res(IDB.db); }; r.onerror = function () { rej(r.error); }; }); },
  tx: function (mode, fn) { return IDB.open().then(function (db) { return new Promise(function (res, rej) { var t = db.transaction('queue', mode), st = t.objectStore('queue'), out = fn(st); t.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); }; t.onerror = function () { rej(t.error); }; }); }); },
  all: function () { return IDB.tx('readonly', function (s) { return s.getAll(); }); },
  put: function (o) { return IDB.tx('readwrite', function (s) { s.put(o); }); },
  del: function (id) { return IDB.tx('readwrite', function (s) { s.delete(id); }); }
};

/* ---------- Server (doPost Apps Script, text/plain → tanpa preflight CORS) ---------- */
function post(action, payload) {
  return fetch(CONFIG.GAS_URL, { method: 'POST', body: JSON.stringify({ action: action, token: LS.get('token', ''), payload: payload || {} }), redirect: 'follow' })
    .then(function (r) { return r.json(); }).then(function (r) { if (!r.ok) { if (r.auth) { LS.del('token'); } throw new Error(r.error); } return r.data; });
}

/* ---------- Mode aplikasi penuh (online) ---------- */
var configured = CONFIG.GAS_URL.indexOf('GANTI_') < 0;
function openApp() {
  if (!configured) { F.open(); toast('Atur CONFIG.GAS_URL di index.html terlebih dahulu.', 5000); return; }
  var fr = $('#appFrame'); if (!fr.src) fr.src = CONFIG.GAS_URL;
  fr.classList.remove('hidden'); $('#field').classList.add('hidden'); $('#fab').classList.remove('hidden');
}

/* ---------- Tombol Back: tidak menutup aplikasi ---------- */
var exitArm = 0;
history.replaceState({ g: 'root' }, '');
history.pushState({ g: 'top' }, '');
window.addEventListener('popstate', function (e) {
  var st = e.state || {};
  if (st.g === 'root') {
    if (!$('#field').classList.contains('hidden') && F.stack.length > 1) { F.back(); history.pushState({ g: 'top' }, ''); return; }
    if (Date.now() - exitArm < 2000) { history.back(); return; }
    exitArm = Date.now(); toast('Tekan Kembali sekali lagi untuk keluar'); history.pushState({ g: 'top' }, '');
  }
});

/* ---------- Mode Lapangan ---------- */
var F = {
  stack: [], map: null, sv: null, watch: null,
  open: function () { $('#appFrame').classList.add('hidden'); $('#fab').classList.add('hidden'); $('#field').classList.remove('hidden'); F.stack = []; F.go(LS.get('token', '') ? 'home' : 'login'); },
  go: function (v, p) { F.stop(); F.stack.push([v, p]); F[v](p || {}); F.net(); },
  back: function () { F.stop(); F.stack.pop(); var t = F.stack[F.stack.length - 1] || ['home']; F[t[0]](t[1] || {}); },
  stop: function () { if (F.watch !== null) { navigator.geolocation.clearWatch(F.watch); F.watch = null; } if (F.map) { try { F.map.stop(); F.map.off(); F.map.remove(); } catch (e) {} F.map = null; } },
  net: function () { IDB.all().then(function (q) { $('#fNet').textContent = (navigator.onLine ? '● Online' : '○ Offline') + (q.length ? ' · ' + q.length + ' antre' : ''); }).catch(function () {}); },
  data: function () { return LS.get('data', { Bidang: [], Komoditas: [], user: {} }); },
  login: function () {
    $('#fMain').innerHTML = '<div class="card"><h3>Masuk Mode Lapangan</h3><p class="tiny muted">Login sekali saat ada sinyal. Setelah itu data lapangan dapat dicatat tanpa internet dan disinkronkan nanti.</p>' +
      '<label>Username</label><input id="lU" autocapitalize="none"><label>Password</label><input id="lP" type="password"><button class="btn pri block" id="lB">Masuk</button><p class="err" id="lE"></p>' +
      (configured ? '<button class="btn block" onclick="openApp()">Buka aplikasi lengkap (online)</button>' : '<p class="err tiny">CONFIG.GAS_URL belum diatur.</p>') + '</div>';
    $('#lB').onclick = function () { var b = this; b.disabled = true; $('#lE').textContent = '';
      post('login', { username: $('#lU').value, password: $('#lP').value, remember: true, ua: 'PWA-field' }).then(function (r) {
        LS.set('token', r.token); F.saveBoot(r.boot); F.stack = []; F.go('home');
      }).catch(function (e) { $('#lE').textContent = navigator.onLine ? e.message : 'Tidak ada koneksi. Login pertama memerlukan internet.'; b.disabled = false; }); };
  },
  saveBoot: function (b) { var L = b.lists || {}; LS.set('data', { Bidang: (L.Bidang || []).filter(function (x) { return x.deleted != 1; }).map(function (x) { return { id: x.id, code: x.code, name: x.name, commodity_id: x.commodity_id, geom: x.geom, status: x.status }; }),
    Komoditas: (L.Komoditas || []).map(function (k) { return { id: k.id, name: k.name }; }), user: { name: b.user.name, role: b.user.role_label }, perms: b.perms, at: new Date().toISOString() }); },
  home: function () {
    var d = F.data();
    $('#fMain').innerHTML = '<div class="card"><div class="row"><div class="sp"><b>' + esc(d.user.name || '') + '</b><div class="tiny muted">' + esc(d.user.role || '') + ' · data perangkat ' + (d.at ? new Date(d.at).toLocaleString('id-ID') : '-') + '</div></div><button class="btn" id="hRef">⟳ Data</button></div></div>' +
      '<div class="grid"><div class="tile" data-v="survey"><span>📍</span>Ukur Batas Lahan</div><div class="tile" data-v="tree"><span>🌴</span>Catat Pohon</div><div class="tile" data-v="pest"><span>🐛</span>Lapor Hama/Penyakit</div><div class="tile" data-v="queue"><span>⇅</span>Antrean & Sinkron</div></div>' +
      '<div class="card" style="margin-top:12px"><p class="tiny muted">Peta jalan (OpenStreetMap) yang pernah Anda lihat saat online tersimpan di perangkat. Citra satelit hanya tersedia saat online (ketentuan penyedia). Batas bidang & titik GPS tetap tampil tanpa internet.</p>' +
      (configured ? '<button class="btn block pri" onclick="openApp()">Buka aplikasi lengkap</button>' : '') + '<button class="btn block" id="hOut">Keluar dari mode lapangan</button><p class="tiny muted">' + esc(CONFIG.APP_NAME) + ' PWA v' + CONFIG.VERSION + '</p></div>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-v]'), function (t) { t.onclick = function () { F.go(t.dataset.v); }; });
    $('#hRef').onclick = function () { post('bootstrap', {}).then(function (b) { F.saveBoot(b); toast('Data perangkat diperbarui.'); F.home(); }).catch(function (e) { toast(e.message); }); };
    $('#hOut').onclick = function () { IDB.all().then(function (q) { if (q.length && !confirm(q.length + ' data belum tersinkron dan akan tetap tersimpan di perangkat. Keluar?')) return; LS.del('token'); F.stack = []; F.go('login'); }); };
  },
  parcelSel: function (id) { var d = F.data(); return '<select id="' + id + '"><option value="">— pilih bidang —</option>' + d.Bidang.map(function (b) { return '<option value="' + b.id + '">' + esc(b.code + ' · ' + (b.name || '')) + '</option>'; }).join('') + '</select>'; },
  mkMap: function (el) {
    F.map = L.map(el, { zoomControl: true, maxZoom: 21 }).setView([-2.5, 118], 5);
    var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 21, attribution: '© OpenStreetMap contributors' }).addTo(F.map);
    var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 19, maxZoom: 21, attribution: 'Tiles © Esri — Esri, Maxar, Earthstar Geographics' });
    L.control.layers({ 'Peta jalan (tersimpan offline)': osm, 'Citra satelit (online)': sat }).addTo(F.map);
    F.ref = L.layerGroup().addTo(F.map);
  },
  showParcel: function (pid) { F.ref.clearLayers(); var b = F.data().Bidang.filter(function (x) { return x.id === pid; })[0]; if (b && b.geom) { var g = L.geoJSON(JSON.parse(b.geom), { style: { color: '#ffd400', dashArray: '6 4', fillOpacity: 0 } }).addTo(F.ref); F.map.fitBounds(g.getBounds(), { padding: [20, 20], animate: false }); } },
  /* ---- survei batas ---- */
  survey: function () {
    F.sv = LS.get('svdraft', { pid: '', pts: [], rec: false, paused: false, start: '' });
    $('#fMain').innerHTML = '<div class="card">' + F.parcelSel('sP') + '<div id="fmap" style="margin-top:8px"></div><div class="stats"><div><b id="sN">0</b><span>titik</span></div><div><b id="sA">—</b><span>akurasi</span></div><div><b id="sH">0</b><span>ha</span></div><div><b id="sK">0</b><span>m keliling</span></div></div>' +
      '<div class="row"><button class="btn pri sp" id="sGo">▶ Rekam</button><button class="btn sp" id="sVx">📍 Ambil titik (5 dtk)</button><button class="btn" id="sUn">↶</button></div><div class="row" style="margin-top:8px"><button class="btn acc sp" id="sFin">✓ Simpan ke antrean</button><button class="btn" id="sClr">Buang</button><button class="btn" onclick="F.back()">‹ Kembali</button></div>' +
      '<p class="tiny muted">Jejak tersimpan otomatis di perangkat setiap titik. Akurasi GPS HP adalah estimasi perangkat. Hasil adalah pemetaan operasional, bukan batas hukum.</p></div>';
    F.mkMap('fmap'); $('#sP').value = F.sv.pid; if (F.sv.pid) F.showParcel(F.sv.pid);
    var line = L.polygon([], { color: '#ff00ff', fillOpacity: .12 }).addTo(F.map), me = null, cur = null, samples = null;
    var ring = function () { var v = F.sv.pts.filter(function (p) { return p.kind === 'vertex'; }); return (v.length >= 3 ? v : F.sv.pts).map(function (p) { return [p.lng, p.lat]; }); };
    var upd = function () { var r = ring(); line.setLatLngs(r.map(function (p) { return [p[1], p[0]]; })); var m = Geo.measure(r); $('#sN').textContent = F.sv.pts.length; $('#sH').textContent = nf(m.area / 1e4, 4); $('#sK').textContent = nf(m.perimeter, 0);
      $('#sGo').textContent = !F.sv.rec ? '▶ Rekam' : F.sv.paused ? '▶ Lanjut' : '⏸ Jeda'; LS.set('svdraft', F.sv); };
    $('#sP').onchange = function () { F.sv.pid = this.value; F.showParcel(this.value); upd(); };
    $('#sGo').onclick = function () { if (!F.sv.pid) return toast('Pilih bidang.'); if (!F.sv.rec) { F.sv.rec = true; F.sv.paused = false; F.sv.start = F.sv.start || new Date().toISOString(); } else F.sv.paused = !F.sv.paused; upd(); };
    $('#sUn').onclick = function () { F.sv.pts.pop(); upd(); };
    $('#sClr').onclick = function () { if (confirm('Buang draf survei?')) { F.sv = { pid: F.sv.pid, pts: [], rec: false, paused: false, start: '' }; upd(); } };
    $('#sVx').onclick = function () { if (samples) return; samples = []; var b = this; b.disabled = true; setTimeout(function () { b.disabled = false; var s = samples.filter(function (x) { return x.acc <= 30; }); samples = null; if (!s.length) return toast('Posisi GPS belum memadai.');
      var w = 0, la = 0, ln = 0; s.forEach(function (x) { var k = 1 / Math.max(x.acc * x.acc, 1e-4); w += k; la += x.lat * k; ln += x.lng * k; }); var acc = Math.max(1 / Math.sqrt(w), Math.min.apply(null, s.map(function (x) { return x.acc; })) * .7);
      F.sv.pts.push({ lat: la / w, lng: ln / w, acc: Math.round(acc * 100) / 100, ts: new Date().toISOString(), kind: 'vertex', note: 'avg ' + s.length + 'x' }); upd(); toast('Titik sudut ±' + nf(acc, 1) + ' m'); }, 5000); };
    $('#sFin').onclick = function () { var r = ring(); if (!F.sv.pid || r.length < 3) return toast('Pilih bidang & minimal 3 titik.'); if (Geo.selfIntersect(r)) return toast('Poligon berpotongan sendiri — urungkan titik.');
      r.push(r[0]); var item = { id: uid(), type: 'survey', label: 'Survei ' + (F.data().Bidang.filter(function (b) { return b.id === F.sv.pid; })[0] || {}).code + ' · ' + nf(Geo.measure(r).area / 1e4, 4) + ' ha', at: new Date().toISOString(),
        payload: { parcel_id: F.sv.pid, points: F.sv.pts, ring: r, reason: 'Survei Mode Lapangan (PWA offline)', meta: { method: 'Smartphone GPS', crs: 'EPSG:4326', started_at: F.sv.start, ended_at: new Date().toISOString(), device: navigator.userAgent.slice(0, 150) } } };
      IDB.put(item).then(function () { LS.del('svdraft'); F.sv = { pid: '', pts: [], rec: false }; toast('Tersimpan di antrean perangkat.'); F.back(); Sync.run(); }); };
    if (navigator.geolocation) F.watch = navigator.geolocation.watchPosition(function (p) {
      cur = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; if (samples) samples.push(cur);
      $('#sA').textContent = '±' + nf(cur.acc, 1) + ' m'; $('#sA').style.color = cur.acc <= 3 ? 'var(--ok)' : cur.acc <= 5 ? 'var(--warn)' : 'var(--bad)';
      if (!me) { me = L.circleMarker([cur.lat, cur.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 }).addTo(F.map); if (!F.sv.pid) F.map.setView([cur.lat, cur.lng], 18); } else me.setLatLng([cur.lat, cur.lng]);
      if (F.sv.rec && !F.sv.paused && cur.acc <= 15) { var last = F.sv.pts[F.sv.pts.length - 1]; if (!last || Geo.dist([last.lng, last.lat], [cur.lng, cur.lat]) >= 2) { F.sv.pts.push({ lat: cur.lat, lng: cur.lng, acc: Math.round(cur.acc * 100) / 100, ts: new Date().toISOString(), kind: 'track' }); upd(); } }
    }, function (e) { toast('GPS: ' + e.message); }, { enableHighAccuracy: true, maximumAge: 0 });
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function () {});
    upd();
  },
  /* ---- formulir pohon & hama ---- */
  photoField: '<label>Foto (opsional)</label><input type="file" id="xF" accept="image/*" capture="environment"><img id="xI" class="pv hidden">',
  gpsField: '<div class="row" style="margin-top:8px"><button class="btn" id="xG" type="button">📍 Ambil GPS</button><span class="tiny" id="xGI">belum ada koordinat</span></div>',
  wire: function () {
    var pos = null, photo = null;
    $('#xG').onclick = function () { var b = this; b.disabled = true; navigator.geolocation.getCurrentPosition(function (p) { pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; $('#xGI').textContent = pos.lat.toFixed(6) + ', ' + pos.lng.toFixed(6) + ' (±' + Math.round(pos.acc) + ' m)'; b.disabled = false; }, function (e) { toast(e.message); b.disabled = false; }, { enableHighAccuracy: true, timeout: 20000 }); };
    $('#xF').onchange = function () { var f = this.files[0]; if (!f) return; Promise.all([compress(f, 1600, .82), compress(f, 240, .7)]).then(function (r) { photo = { data: r[0].split(',')[1], thumb: r[1], name: f.name.replace(/\.\w+$/, '') + '.jpg', at: new Date(f.lastModified || Date.now()).toISOString() }; $('#xI').src = r[0]; $('#xI').classList.remove('hidden'); }); };
    return { pos: function () { return pos; }, photo: function () { return photo; } };
  },
  tree: function () {
    var d = F.data();
    $('#fMain').innerHTML = '<div class="card"><h3>Catat Pohon Baru</h3><label>Bidang *</label>' + F.parcelSel('tP') + '<label>ID Pohon *</label><input id="tC" placeholder="mis. BDG-001-0123"><div class="grid"><div><label>No. baris</label><input id="tR" type="number"></div><div><label>No. pohon</label><input id="tN" type="number"></div></div>' +
      '<label>Komoditas *</label><select id="tK">' + d.Komoditas.map(function (k) { return '<option value="' + k.id + '">' + esc(k.name) + '</option>'; }).join('') + '</select><div class="grid"><div><label>Kesehatan</label><select id="tH"><option>Sehat</option><option>Gejala Ringan</option><option>Sakit</option><option>Kritis</option><option selected>Belum Diperiksa</option></select></div><div><label>Tanggal tanam</label><input id="tD" type="date"></div></div>' +
      '<label>Catatan</label><input id="tT">' + F.gpsField + F.photoField + '<button class="btn pri block" id="tS">Simpan ke antrean</button><button class="btn block" onclick="F.back()">‹ Kembali</button></div>';
    var w = F.wire();
    $('#tP').onchange = function () { var b = d.Bidang.filter(function (x) { return x.id === $('#tP').value; })[0]; if (b && b.commodity_id) $('#tK').value = b.commodity_id; if (b && !$('#tC').value) $('#tC').value = b.code + '-'; };
    $('#tS').onclick = function () {
      if (!$('#tP').value || !$('#tC').value || !$('#tK').value) return toast('Lengkapi bidang, ID pohon, komoditas.');
      var p = w.pos(), data = { parcel_id: $('#tP').value, code: $('#tC').value.trim(), commodity_id: $('#tK').value, row_no: $('#tR').value, tree_no: $('#tN').value, health: $('#tH').value, planting_date: $('#tD').value, status: 'Aktif', notes: $('#tT').value, lat: p ? Math.round(p.lat * 1e7) / 1e7 : '', lng: p ? Math.round(p.lng * 1e7) / 1e7 : '' };
      IDB.put({ id: uid(), type: 'save', ent: 'Pohon', label: 'Pohon ' + data.code, at: new Date().toISOString(), payload: { ent: 'Pohon', data: data }, photo: w.photo(), photoCat: 'Keseluruhan', pos: p }).then(function () { toast('Tersimpan di antrean.'); F.back(); Sync.run(); });
    };
  },
  pest: function () {
    $('#fMain').innerHTML = '<div class="card"><h3>Lapor Hama / Penyakit</h3><label>Bidang *</label>' + F.parcelSel('pP') + '<div class="grid"><div><label>Jenis</label><select id="pK"><option>Hama</option><option>Penyakit</option><option>Gulma</option><option>Defisiensi Hara</option></select></div><div><label>Tingkat</label><select id="pS"><option>Ringan</option><option>Sedang</option><option>Berat</option></select></div></div>' +
      '<label>Nama hama/penyakit *</label><input id="pN"><label>Gejala</label><textarea id="pG"></textarea>' + F.gpsField + F.photoField + '<button class="btn pri block" id="pX">Simpan ke antrean</button><button class="btn block" onclick="F.back()">‹ Kembali</button></div>';
    var w = F.wire();
    $('#pX').onclick = function () {
      if (!$('#pP').value || !$('#pN').value) return toast('Lengkapi bidang & nama.');
      var p = w.pos(), today = new Date().toISOString().slice(0, 10), data = { parcel_id: $('#pP').value, date: today, kind: $('#pK').value, name: $('#pN').value, severity: $('#pS').value, symptoms: $('#pG').value, status: 'Terbuka', lat: p ? p.lat : '', lng: p ? p.lng : '' };
      IDB.put({ id: uid(), type: 'save', ent: 'HamaPenyakit', label: data.kind + ': ' + data.name, at: new Date().toISOString(), payload: { ent: 'HamaPenyakit', data: data }, photo: w.photo(), photoCat: data.kind === 'Hama' ? 'Hama' : 'Penyakit', pos: p }).then(function () { toast('Tersimpan di antrean.'); F.back(); Sync.run(); });
    };
  },
  queue: function () {
    IDB.all().then(function (q) {
      $('#fMain').innerHTML = '<div class="card"><div class="row"><h3 class="sp">Antrean (' + q.length + ')</h3><button class="btn pri" id="qS"' + (q.length ? '' : ' disabled') + '>⇅ Sinkron sekarang</button></div>' +
        (q.length ? q.map(function (i) { return '<div class="q"><span class="sp">' + esc(i.label) + '<br><span class="tiny muted">' + new Date(i.at).toLocaleString('id-ID') + (i.photo ? ' · 📷' : '') + '</span></span>' + (i.error ? '<span class="pill bad" title="' + esc(i.error) + '">gagal</span>' : '<span class="pill">menunggu</span>') + '</div>' + (i.error ? '<div class="tiny err">' + esc(i.error) + '</div>' : ''); }).join('') : '<p class="muted">Semua data sudah tersinkron.</p>') +
        '<p class="tiny muted">Data gagal (mis. kode duplikat) tetap disimpan agar bisa diperbaiki melalui aplikasi lengkap. Sinkron otomatis saat online.</p><button class="btn block" onclick="F.back()">‹ Kembali</button></div>';
      if ($('#qS')) $('#qS').onclick = function () { this.disabled = true; Sync.run(true).then(function () { F.queue(); }); };
    });
  }
};

/* ---------- Sinkronisasi (idempotent: op_id stabil per item) ---------- */
var Sync = {
  busy: false,
  run: function (manual) {
    if (Sync.busy || !navigator.onLine || !LS.get('token', '') || !configured) { if (manual) toast(!navigator.onLine ? 'Masih offline.' : 'Belum login / URL belum diatur.'); return Promise.resolve(); }
    Sync.busy = true;
    return IDB.all().then(function (q) {
      return q.reduce(function (p, it) { return p.then(function () {
        var op = it.type === 'survey' ? { op_id: it.id + '-s', action: 'saveSurvey', payload: it.payload } : { op_id: it.id + '-e', action: 'save', payload: it.payload };
        return post('syncPush', { ops: [op] }).then(function (r) {
          var x = r[0]; if (!x.ok) throw new Error(x.error);
          var id = it.entity_id || (x.result && x.result.id);
          if (it.photo && id) { it.entity_id = id; return IDB.put(it).then(function () {
            return post('syncPush', { ops: [{ op_id: it.id + '-m', action: 'uploadMedia', payload: { entity: it.ent, entity_id: id, category: it.photoCat, data: it.photo.data, thumb: it.photo.thumb, mime: 'image/jpeg', name: it.photo.name, captured_at: it.photo.at, lat: it.pos ? it.pos.lat : '', lng: it.pos ? it.pos.lng : '' } }] }); }).then(function (r2) { if (!r2[0].ok) throw new Error('Foto: ' + r2[0].error); }); }
        }).then(function () { return IDB.del(it.id); }).catch(function (e) { it.error = e.message; if (/AUTH|Sesi/.test(e.message)) throw e; return IDB.put(it); });
      }); }, Promise.resolve());
    }).then(function () { if (manual) toast('Sinkronisasi selesai.'); }).catch(function (e) { toast('Sinkron berhenti: ' + e.message + (/AUTH|Sesi/.test(e.message) ? ' — login ulang.' : '')); })
      .then(function () { Sync.busy = false; F.net(); });
  }
};

/* ---------- Geo util (UTM, sama dengan server) ---------- */
var Geo = {
  utm: function (lng, lat, zone) { var a = 6378137, f = 1 / 298.257223563, k0 = .9996, e2 = f * (2 - f), ep2 = e2 / (1 - e2), phi = lat * Math.PI / 180, lam = lng * Math.PI / 180, lam0 = ((zone - 1) * 6 - 177) * Math.PI / 180;
    var N = a / Math.sqrt(1 - e2 * Math.sin(phi) * Math.sin(phi)), T = Math.tan(phi) * Math.tan(phi), C = ep2 * Math.cos(phi) * Math.cos(phi), A = Math.cos(phi) * (lam - lam0);
    var M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 * e2 * e2 / 256) * phi - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 * e2 * e2 / 1024) * Math.sin(2 * phi) + (15 * e2 * e2 / 256 + 45 * e2 * e2 * e2 / 1024) * Math.sin(4 * phi) - (35 * e2 * e2 * e2 / 3072) * Math.sin(6 * phi));
    return [k0 * N * (A + (1 - T + C) * Math.pow(A, 3) / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * Math.pow(A, 5) / 120) + 5e5, k0 * (M + N * Math.tan(phi) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * Math.pow(A, 6) / 720))]; },
  measure: function (r) { if (r.length < 3) return { area: 0, perimeter: 0 }; r = r.slice(); if (r[0][0] !== r[r.length - 1][0] || r[0][1] !== r[r.length - 1][1]) r.push(r[0]); var z = Math.floor((r[0][0] + 180) / 6) + 1, p = r.map(function (c) { return Geo.utm(c[0], c[1], z); }), s = 0, per = 0;
    for (var i = 0; i < p.length - 1; i++) { s += p[i][0] * p[i + 1][1] - p[i + 1][0] * p[i][1]; per += Math.hypot(p[i + 1][0] - p[i][0], p[i + 1][1] - p[i][1]); } return { area: Math.abs(s) / 2, perimeter: per }; },
  dist: function (a, b) { var R = 6371008.8, dl = (b[1] - a[1]) * Math.PI / 180, dg = (b[0] - a[0]) * Math.PI / 180, h = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a[1] * Math.PI / 180) * Math.cos(b[1] * Math.PI / 180) * Math.sin(dg / 2) * Math.sin(dg / 2); return 2 * R * Math.asin(Math.sqrt(h)); },
  selfIntersect: function (r) { var o = function (a, b, c) { var v = (b[1] - a[1]) * (c[0] - b[0]) - (b[0] - a[0]) * (c[1] - b[1]); return Math.abs(v) < 1e-14 ? 0 : v > 0 ? 1 : 2; }; r = r.slice(); r.push(r[0]);
    for (var i = 0; i < r.length - 1; i++) for (var j = i + 2; j < r.length - 1; j++) { if (i === 0 && j === r.length - 2) continue; var a = o(r[i], r[i + 1], r[j]), b = o(r[i], r[i + 1], r[j + 1]), c = o(r[j], r[j + 1], r[i]), d = o(r[j], r[j + 1], r[i + 1]); if (a && b && c && d && a !== b && c !== d) return true; } return false; }
};
function compress(file, max, q) { return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { var im = new Image(); im.onload = function () { var s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; im.onerror = rej; im.src = fr.result; }; fr.readAsDataURL(file); }); }

/* ---------- Mulai ---------- */
window.addEventListener('online', function () { F.net(); Sync.run(); });
window.addEventListener('offline', function () { F.net(); if ($('#field').classList.contains('hidden')) { toast('Offline — beralih ke Mode Lapangan.', 4000); F.open(); } });
var leafletReady = new Promise(function (res) { var s = document.createElement('script'); s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload = res; s.onerror = function () { res(); }; document.head.appendChild(s); });
leafletReady.then(function () {
  if (navigator.onLine && configured && location.hash !== '#lapangan') openApp(); else F.open();
  Sync.run();
});
setInterval(function () { Sync.run(); }, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(function (reg) {
  reg.addEventListener('updatefound', function () { var nw = reg.installing; nw && nw.addEventListener('statechange', function () { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('Versi baru tersedia — muat ulang aplikasi.', 6000); }); });
}).catch(function () {});
</script>
